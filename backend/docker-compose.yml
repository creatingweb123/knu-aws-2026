# 로컬 개발 환경 (docs/02 §2.4, BE-INFRA-08). 개발과 단위·로컬 통합 테스트용이며 T 시나리오 판정 근거가 아니다(BE-Q15).
#   cp .env.example .env   (없어도 기본값으로 뜬다)
#   docker compose up -d --build
#   docker compose logs aws     # init 출력(풀 ID, 클라이언트 ID, LOCAL_JWT_ISSUER)
#   docker compose down         # 데이터는 floci-data 볼륨에 남는다(-v로 지운다)
# 이번 범위(1–3단계, 6a·6b)에는 SQS·S3·ollama를 넣지 않는다. AI 경로는 Fake 모델이 기본이다.
name: haru

services:
  aws: # DynamoDB, Cognito User Pool
    image: floci/floci:2.5.0-compat # 태그 고정, latest 금지. init에서 boto3를 쓰려면 -compat
    ports: ["4566:4566"]
    env_file:
      - path: .env
        required: false
    environment:
      FLOCI_DEFAULT_REGION: ap-northeast-2
      AWS_DEFAULT_REGION: ap-northeast-2
      FLOCI_STORAGE_MODE: hybrid # 재시작해도 데이터 유지
      FLOCI_STORAGE_PERSISTENT_PATH: /var/lib/floci
      FLOCI_INIT_HOOKS_TIMEOUT_SECONDS: "120"
    volumes:
      - ./local/init:/etc/floci/init/ready.d:ro
      - floci-data:/var/lib/floci
    healthcheck:
      # init 스크립트(local/init/01_haru.py)가 모든 단계를 마치면 표시 파일을 남긴다.
      test: ["CMD-SHELL", "test -f /tmp/haru-init-done"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 5s

  api: # HTTP 어댑터: payload 2.0 변환 + JWT 검증 + 같은 Lambda 핸들러 호출
    build:
      context: .
      dockerfile: local/adapter/Dockerfile
    ports: ["3000:3000"]
    env_file:
      - path: .env
        required: false
    environment:
      STAGE: local
      AWS_ENDPOINT_URL: http://aws:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: ap-northeast-2
      AWS_DEFAULT_REGION: ap-northeast-2
      AWS_EMF_ENVIRONMENT: Local
      TABLE_NAME: HaruTable
      CHECKPOINT_TABLE: HaruAgentCheckpoints
      AREA_ID: default
      CLAIM_DURATION_DAYS: "3"
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      # AI 하루 카드 레벨 0 (6a). 기본은 Fake 모델이라 사연이 밖으로 나가지 않는다.
      # 실모델 전환은 .env에서 LLM_PROVIDER=openai_compat, LLM_BASE_URL, LLM_MODEL, LLM_API_KEY를 채운다(합성 사연만).
      # bedrock은 아래 AWS 자격 증명이 Floci용 test 값이라 이 컨테이너에서는 401로 끝난다(.env.example 참고).
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      FAKE_LLM_ALLOWED: "true"
      FAKE_LLM_SCENARIO: ${FAKE_LLM_SCENARIO:-happy}
      # 기본은 레벨 0(6a 로컬 23건 그대로). 에이전트는 AGENT_MODE=agent로 다시 띄운다(tests/local/test_local_agent.py).
      AGENT_MODE: ${AGENT_MODE:-pipeline}
      CHECKPOINT_DDB_ENDPOINT: http://aws:4566
      LLM_TOOL_CHOICE: ${LLM_TOOL_CHOICE:-}
      LLM_PARALLEL_TOOL_CALLS: ${LLM_PARALLEL_TOOL_CALLS:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-800}
      # 로컬 전용 테스트 훅(강제 종료 주입). STAGE=local에서만 동작한다.
      AGENT_TEST_HOOKS: ${AGENT_TEST_HOOKS:-false}
      AGENT_CRASH_AT: ${AGENT_CRASH_AT:-}
      FAULT_INJECT: ${FAULT_INJECT:-}
      FAULT_INJECT_ALLOWED: "true"
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_REGION: ${LLM_REGION:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER_LABEL: ${LLM_PROVIDER_LABEL:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE-0}
      LLM_EXTRA_BODY: ${LLM_EXTRA_BODY:-}
      LLM_CONNECT_TIMEOUT_S: ${LLM_CONNECT_TIMEOUT_S:-2}
      LLM_READ_TIMEOUT_S: ${LLM_READ_TIMEOUT_S:-8}
      AI_DAILY_SESSION_LIMIT: ${AI_DAILY_SESSION_LIMIT:-10}
      LOCAL_USER_POOL_CLIENT_ID: ${LOCAL_USER_POOL_CLIENT_ID:-haruLocalWebClient}
      LOCAL_JWT_ISSUER: ${LOCAL_JWT_ISSUER:-http://localhost:4566/ap-northeast-2_haruLocal}
      LOCAL_JWKS_URL: ${LOCAL_JWKS_URL:-http://aws:4566/ap-northeast-2_haruLocal/.well-known/jwks.json}
      CORS_ALLOWED_ORIGIN: http://localhost:5173
    depends_on:
      aws:
        condition: service_healthy

volumes:
  floci-data: {}
