[pytest]
pythonpath = src
testpaths = tests
addopts = -m "not local and not integration"
markers =
    local: docker compose 로컬 환경이 떠 있어야 하는 테스트 (pytest -m local)
    integration: 배포된 AWS 스택 대상 테스트, AWS 담당이 실행 (pytest -m integration)
    fault: 함수 설정을 바꿔야 하는 장애 판정(T12 등). pytest -m "integration and fault"로 따로 실행
