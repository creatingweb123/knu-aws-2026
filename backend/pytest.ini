[pytest]
pythonpath = src
testpaths = tests
addopts = -m "not local and not integration and not slow and not fault"
markers =
    local: docker compose 로컬 환경이 떠 있어야 하는 테스트 (pytest -m local)
    integration: 배포된 AWS 스택 대상 테스트, AWS 담당이 실행 (pytest -m integration)
    slow: 느린 단위 테스트(사진 40MP 메모리 측정). 기본 실행에서 빠지고 Checkpoint에서 pytest -m slow로 반드시 실행
    fault: dev 스택 장애·지연 주입 배포에서만 실행하는 AWS 테스트 (pytest -m "integration and fault")
