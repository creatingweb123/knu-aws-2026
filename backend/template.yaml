AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  이어온 하루 백엔드 1–5단계와 6a·6b단계 (HttpApi + JWT authorizer, Cognito, HaruTable, /me, /plans, /claims, /inbox,
  사진 파이프라인, AI 하루 카드 /ai/card-sessions, 레벨 0과 6b 에이전트·체크포인트 테이블)와 7단계(웹 버킷 + CloudFront OAC,
  CloudWatch 알람·대시보드, 선택 AWS Budgets).

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:5173
    Description: API CORS 허용 Origin(로컬 개발 등). 이 스택의 CloudFront 도메인(https://<DistributionDomain>)은 템플릿이 자동으로 덧붙인다(BE-INFRA-03). 사진 버킷 CORS도 같은 값을 쓴다.
  Stage:
    Type: String
    AllowedValues: [dev, demo]
    Default: demo
    Description: samconfig.toml의 dev/demo가 명시한다. 기본을 demo로 두어 장애 주입(BE-Q59)과 Fake 모델(BE-Q86)이 기본 차단된다.
  FaultInject:
    Type: String
    AllowedValues: ["", photo, photo-slow]
    Default: ""
    Description: dev 전용 장애·지연 주입(T9, T10·T15). Stage=dev이고 실제 스택 이름이 haru-dev일 때만 함수에 들어간다.
  UploadIfNoneMatch:
    Type: String
    AllowedValues: ["false", "true"]
    Default: "false"
    Description: presigned PUT에 If-None-Match:* 서명(BE-Q65). 프론트엔드 승인 전에는 false를 유지한다.
  # --- AI 하루 카드 (6a, docs/03 §3.2 설정 키). 공급자·모델 값은 BE-Q6 확정 전까지 빈 값이다(samconfig에 넣지 않는다).
  LlmProvider:
    Type: String
    AllowedValues: [bedrock, openai_compat, fake]
    Default: bedrock
    Description: bedrock은 Amazon Bedrock Converse(IAM 인증, 키 없음). fake는 Stage=dev이고 실제 스택 이름이 haru-dev일 때만 함수에 들어간다(BE-Q86). 결과는 실제 공급자 검증이 아니다.
  LlmBaseUrl:
    Type: String
    Default: ""
    Description: /chat/completions 앞까지. 빈 값이면 openai_compat은 CONFIG(503)로 끝나 사연이 나가지 않는다.
  LlmModel:
    Type: String
    Default: ""
    Description: bedrock은 모델 ID 또는 추론 프로필 ID(예 apac.anthropic.claude-...). 빈 값이면 CONFIG(503)로 끝나 사연이 나가지 않는다.
  LlmRegion:
    Type: String
    Default: ""
    AllowedPattern: ^$|^[a-z]{2}(-[a-z]+)+-[0-9]$
    Description: bedrock 호출 리전. 빈 값이면 함수 리전(AWS_REGION)이다.
  LlmApiKeyParam:
    Type: String
    Default: ""
    AllowedPattern: ^$|^(/[A-Za-z0-9_.-]+)+$
    Description: SSM SecureString 이름(/haru/<stage>/llm/api-key). 템플릿은 만들지 않는다(AWS 담당, BE-Q81). 빈 값이면 SSM 권한도 없다.
  LlmProviderLabel:
    Type: String
    Default: ""
  LlmTemperature:
    Type: String
    Default: "0"
    Description: 빈 값이면 보내지 않는다(1 미만을 거부하는 공급자).
  LlmMaxTokens:
    Type: String
    Default: "800"
  LlmConnectTimeoutS:
    Type: String
    Default: "2"
  LlmReadTimeoutS:
    Type: String
    Default: "8"
  LlmExtraBody:
    Type: String
    Default: ""
    Description: 공급자별 추가 필드 JSON 객체. 예 {"reasoning_effort":"none"}
  LlmToolChoice:
    Type: String
    AllowedValues: ["", auto, required]
    Default: ""
    Description: 6b bind_tools용. 레벨 0은 쓰지 않는다.
  LlmParallelToolCalls:
    Type: String
    AllowedValues: ["", "false"]
    Default: ""
    Description: 6b bind_tools용. 레벨 0은 쓰지 않는다.
  AgentMode:
    Type: String
    AllowedValues: [pipeline, agent]
    Default: pipeline
    Description: pipeline = 레벨 0(6a), agent = 6b 에이전트. 바꾸면 진행 중 에이전트 세션은 다음 요청에서 결정적으로 닫힌다(design §13).
  AiFaultInject:
    Type: String
    AllowedValues: ["", ai-slow]
    Default: ""
    Description: dev 전용 장애 주입(T21, BE-Q107). 5단계 FaultInject와 이름을 나눈다.
  AiDailySessionLimit:
    Type: String
    Default: "10"

  # --- 7단계 알람 임계값. 명세에 값이 없어 **임시값**이다(BE-Q130). 값은 dev 부하 관측 뒤 AWS 담당·팀이 정한다.
  AlarmApi5xxThreshold:
    Type: Number
    Default: 5
    Description: HTTP API 5xx 5분 합계가 이 값보다 크면 알람(임시값, BE-Q130).
  AlarmLambdaErrorsThreshold:
    Type: Number
    Default: 1
    Description: 모든 Lambda 함수의 Errors 5분 합계가 이 값 이상이면 알람(임시값, BE-Q130). 사진 처리 재시도 오류도 포함한다.
  AlarmApiLambdaDurationMs:
    Type: Number
    Default: 8000
    Description: Me·Plans·Claims·Inbox 함수 Duration p95 상한(기본 타임아웃 10초의 80%, 임시값, BE-Q130).
  AlarmAiLambdaDurationMs:
    Type: Number
    Default: 22000
    Description: AiCardFunction Duration p95 상한(타임아웃 27초의 약 80%, 임시값, BE-Q130).
  AlarmPhotoLambdaDurationMs:
    Type: Number
    Default: 24000
    Description: PhotoProcessorFunction Duration p95 상한(타임아웃 30초의 80%, 임시값, BE-Q130).
  # --- AWS Budgets 월 비용 알림(BE-OBS-02). 금액과 수신자는 코드에 넣지 않는다. 둘 다 채울 때만 만든다(BE-Q131).
  BudgetMonthlyUsd:
    Type: Number
    Default: 0
    Description: 월 예산(USD). 0이면 Budget을 만들지 않는다. 금액은 AWS 담당·팀이 정한다(BE-Q131).
  BudgetNotificationEmail:
    Type: String
    Default: ""
    Description: 예산 알림 수신 이메일. 비우면 Budget을 만들지 않는다. samconfig나 --parameter-overrides로만 넣고 저장소에 올리지 않는다(BE-Q131).

Conditions:
  IsDev: !Equals [!Ref Stage, dev]
  # Rules는 파라미터 값만 검사하므로 실제 스택 이름까지 확인한다(BE-Q86, 5단계 BE-Q59와 같은 방식). 이름은 samconfig dev stack_name과 같다.
  FakeAllowed: !And [!Condition IsDev, !Equals [!Ref "AWS::StackName", haru-dev]]
  # 5단계 사진 장애 주입(BE-Q59). FakeAllowed와 같은 조건이다.
  FaultAllowed: !And [!Condition IsDev, !Equals [!Ref "AWS::StackName", haru-dev]]
  UseIfNoneMatch: !Equals [!Ref UploadIfNoneMatch, "true"]
  CreateBudget: !And
    - !Not [!Equals [!Ref BudgetNotificationEmail, ""]]
    - !Not [!Equals [!Ref BudgetMonthlyUsd, 0]]
  HasLlmKeyParam: !Not [!Equals [!Ref LlmApiKeyParam, ""]]
  LlmIsFake: !Equals [!Ref LlmProvider, fake]
  HasLlmRegion: !Not [!Equals [!Ref LlmRegion, ""]]

Rules:
  FakeLlmOnlyInDev:
    Assertions:
      - Assert: !Or [!Equals [!Ref Stage, dev], !Not [!Equals [!Ref LlmProvider, fake]]]
        AssertDescription: LlmProvider=fake는 Stage=dev에서만 쓸 수 있다(BE-Q86).
  AiFaultInjectOnlyInDev:
    Assertions:
      - Assert: !Or [!Equals [!Ref Stage, dev], !Equals [!Ref AiFaultInject, ""]]
        AssertDescription: AiFaultInject는 Stage=dev에서만 쓸 수 있다(BE-Q107).
  FaultInjectOnlyInDev:
    Assertions:
      - Assert: !Or [!Equals [!Ref Stage, dev], !Equals [!Ref FaultInject, ""]]
        AssertDescription: FaultInject는 Stage=dev에서만 쓸 수 있다(BE-Q59).

Globals:
  Function:
    Runtime: python3.12
    CodeUri: src/
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref HaruTable
        AREA_ID: default
        CLAIM_DURATION_DAYS: "3"
        LANGSMITH_TRACING: "false"
        LANGCHAIN_TRACING_V2: "false"
        # AWS_ENDPOINT_URL, AWS_EMF_ENVIRONMENT는 로컬 전용이라 정의하지 않는다(BE-INFRA-05).

Resources:
  HaruTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # 6b 에이전트 그래프 체크포인트(design §18.1). 항목 ttl ≤ AiSession ttl(BE-Q104). AiCardFunction만 쓴다.
  HaruAgentCheckpoints:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes: [email]
      Schema:
        - Name: nickname
          AttributeDataType: String
          Mutable: true
          Required: true
      # 비밀번호 정책은 Cognito 기본(BE-Q27)
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # StageName을 두지 않으면 스테이지는 $default다.
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
      CorsConfiguration:
        AllowOrigins: !Split [",", !Join [",", [!Join [",", !Ref AllowedOrigins], !Sub "https://${WebDistribution.DomainName}"]]]
        AllowHeaders: [Authorization, Content-Type, Idempotency-Key]
        AllowMethods: [GET, POST, PUT, OPTIONS]
      # AI 경로 스로틀(BE-Q82 임시값, design §19.2). 초과 응답 429 {"message":"Too Many Requests"}는 계약 에러 형식이 아니다(BE-Q92).
      RouteSettings:
        "POST /ai/card-sessions": { ThrottlingRateLimit: 2, ThrottlingBurstLimit: 5 }
        "POST /ai/card-sessions/{sessionId}/turns": { ThrottlingRateLimit: 5, ThrottlingBurstLimit: 10 }
        "GET /ai/card-sessions/{sessionId}": { ThrottlingRateLimit: 10, ThrottlingBurstLimit: 20 }

  # 경로는 src/handlers/routes.py와 같아야 한다(tests/unit/test_template.py가 확인).
  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.me.handler
      # GET /me는 HaruTable 기본 테이블 Query로 미확인 수를 센다. GET /me/claims가 GSI2 조회와 Plan·Record 읽기를 쓴다.
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource:
                - !GetAtt HaruTable.Arn
                - !Sub ${HaruTable.Arn}/index/*
      Events:
        GetMe:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /me, Method: GET }
        GetMyClaims:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /me/claims, Method: GET }

  PlansFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.plans.handler
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              # TransactWriteItems의 Put·Update는 dynamodb:PutItem·UpdateItem 권한으로 실행된다.
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
              Resource:
                - !GetAtt HaruTable.Arn
                - !Sub ${HaruTable.Arn}/index/*
      Events:
        CreatePlan:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /plans, Method: POST }
        ListPlans:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /plans, Method: GET }
        GetPlan:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/plans/{planId}", Method: GET }
        ClaimPlan:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/plans/{planId}/claims", Method: POST }

  ClaimsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.claims.handler
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              # 포기·기록·완료 트랜잭션(Update·Put·ConditionCheck)과 ConsistentRead 읽기. Query는 쓰지 않는다.
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:ConditionCheckItem]
              Resource: !GetAtt HaruTable.Arn
            - Effect: Allow
              # 원본 업로드 presigned PUT 서명용(서명한 역할의 권한으로 실행된다, Requirement 11.1)
              Action: [s3:PutObject]
              Resource: !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-photos-${AWS::AccountId}/photos/original/*
      Environment:
        Variables:
          PHOTO_BUCKET: !Sub ${AWS::StackName}-photos-${AWS::AccountId}
          PUBLIC_S3_ENDPOINT: ""
          PHOTO_UPLOAD_IF_NONE_MATCH: !If [UseIfNoneMatch, "true", "false"]
      Events:
        AbandonClaim:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/claims/{claimId}/abandon", Method: POST }
        GetRecord: # TransactGetItems는 GetItem 권한으로 실행된다(BE-Q46 권장안, 계약 변경 승인 대기)
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/claims/{claimId}/record", Method: GET }
        PutRecord:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/claims/{claimId}/record", Method: PUT }
        ReplacePhoto:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/claims/{claimId}/record/photo", Method: POST }
        CompleteClaim:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/claims/{claimId}/complete", Method: POST }

  # AI 하루 카드 레벨 0 (6a). AI 의존성은 이 함수 산출물에만 들어간다(src/Makefile, BE-Q80).
  AiCardFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: handlers.ai_card.handler
      Timeout: 27  # HTTP API 통합 상한 30초보다 짧게(docs/03 §3.2)
      MemorySize: 1024
      Architectures: [x86_64]
      Environment:
        Variables:
          # fake가 허용되지 않으면 bedrock으로 바꾼다(함수에 fake가 들어가지 않는다)
          LLM_PROVIDER: !If [FakeAllowed, !Ref LlmProvider, !If [LlmIsFake, bedrock, !Ref LlmProvider]]
          FAKE_LLM_ALLOWED: !If [FakeAllowed, "true", "false"]
          LLM_BASE_URL: !Ref LlmBaseUrl
          LLM_MODEL: !Ref LlmModel
          LLM_REGION: !If [HasLlmRegion, !Ref LlmRegion, !Ref "AWS::NoValue"]
          LLM_API_KEY_PARAM: !If [HasLlmKeyParam, !Ref LlmApiKeyParam, !Ref "AWS::NoValue"]
          LLM_PROVIDER_LABEL: !Ref LlmProviderLabel
          LLM_TEMPERATURE: !Ref LlmTemperature
          LLM_MAX_TOKENS: !Ref LlmMaxTokens
          LLM_CONNECT_TIMEOUT_S: !Ref LlmConnectTimeoutS
          LLM_READ_TIMEOUT_S: !Ref LlmReadTimeoutS
          LLM_MAX_RETRIES: "0"
          LLM_EXTRA_BODY: !Ref LlmExtraBody
          LLM_TOOL_CHOICE: !Ref LlmToolChoice
          LLM_PARALLEL_TOOL_CALLS: !Ref LlmParallelToolCalls
          AGENT_MODE: !Ref AgentMode
          CHECKPOINT_TABLE: !Ref HaruAgentCheckpoints
          # 장애 주입 세 겹 차단: Rules, 이 조건(dev ∧ haru-dev), 런타임(FAULT_INJECT_ALLOWED ∧ 함수 이름 haru-dev-)
          FAULT_INJECT: !If [FakeAllowed, !Ref AiFaultInject, ""]
          FAULT_INJECT_ALLOWED: !If [FakeAllowed, "true", "false"]
          AI_DAILY_SESSION_LIMIT: !Ref AiDailySessionLimit
          # AI 함수 전용 SDK 설정(BE-Q85). 다른 함수는 기본값 그대로다(BE-Q48).
          AI_SDK_CONNECT_TIMEOUT_S: "1"
          AI_SDK_READ_TIMEOUT_S: "2"
          AI_SDK_MAX_ATTEMPTS: "2"
          # LLM_API_KEY는 정의하지 않는다(로컬 전용). 키는 SSM에서 읽는다.
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              # 자기 세션·할당량 항목만. Plan·User·Claim·Idem 키에는 쓰지 못한다(G6, BE-INFRA-06).
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt HaruTable.Arn
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys: ["AISESSION#*", "AIQUOTA#*"]
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              # 체크포인트 라이브러리가 쓰는 연산 5개뿐(V9). delete_thread는 BatchWriteItem DeleteRequest
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:BatchGetItem, dynamodb:BatchWriteItem]
              Resource: !GetAtt HaruAgentCheckpoints.Arn
        - !If
          - HasLlmKeyParam
          - Version: "2012-10-17"
            Statement:
              - Effect: Allow
                # aws/ssm 관리형 키는 KMS 권한이 따로 필요 없다(design §14.3).
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${LlmApiKeyParam}"
          - !Ref "AWS::NoValue"
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              # Bedrock Converse(LLM_PROVIDER=bedrock). 스트리밍은 쓰지 않는다. 교차 리전 추론 프로필은
              # 프로필과 대상 리전들의 기반 모델 둘 다 권한이 있어야 해서 기반 모델은 리전을 와일드카드로 둔다.
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"
                - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:application-inference-profile/*"
      Events:
        CreateAiCardSession:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /ai/card-sessions, Method: POST }
        GetAiCardSession:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/ai/card-sessions/{sessionId}", Method: GET }
        AiCardSessionTurn:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/ai/card-sessions/{sessionId}/turns", Method: POST }

  # 에이전트 토큰 사용량(design §17, BE-Q114 임시). 세션 상한 3만 × 10. 알림 대상은 두지 않는다(BE-Q62와 같은 방식).
  AgentTokensAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: AI 에이전트 토큰 5분 합계가 300,000을 넘었다(임시 임계값, BE-Q114).
      Namespace: Haru
      MetricName: AgentTokens
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  InboxFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.inbox.handler
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              # 수신함 Query·상세 GetItem(InboxItem·Plan·Record)과 read·reply 조건부 UpdateItem. GSI는 쓰지 않는다.
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:UpdateItem]
              Resource: !GetAtt HaruTable.Arn
            - Effect: Allow
              # 수신함 상세 photoUrl presigned GET 서명용(전달된 처리본만, Requirement 11.2)
              Action: [s3:GetObject]
              Resource: !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-photos-${AWS::AccountId}/photos/processed/*
      Environment:
        Variables:
          PHOTO_BUCKET: !Sub ${AWS::StackName}-photos-${AWS::AccountId}
          PUBLIC_S3_ENDPOINT: ""
      Events:
        ListInbox:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /inbox, Method: GET }
        GetInboxItem:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/inbox/{itemId}", Method: GET }
        ReadInboxItem:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/inbox/{itemId}/read", Method: POST }
        ReplyInboxItem:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/inbox/{itemId}/reply", Method: POST }

  # ---------------------------------------------------------------- 5단계 사진 파이프라인 (docs/02 §2.7)
  # 순환 의존성 회피(BE-PHOTO-09): 큐 정책은 버킷 ARN을 문자열로 쓰고, 버킷은 큐 정책 뒤에 만든다.
  PhotoDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14일(BE-Q53)
      SqsManagedSseEnabled: true

  PhotoQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180 # 6 × PhotoProcessorFunction Timeout(30초)
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PhotoDLQ.Arn
        maxReceiveCount: 3

  PhotoQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref PhotoQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt PhotoQueue.Arn
            Condition:
              ArnEquals: { "aws:SourceArn": !Sub "arn:${AWS::Partition}:s3:::${AWS::StackName}-photos-${AWS::AccountId}" }
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }

  PhotoBucket:
    Type: AWS::S3::Bucket
    DependsOn: PhotoQueuePolicy
    Properties:
      BucketName: !Sub ${AWS::StackName}-photos-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Split [",", !Join [",", [!Join [",", !Ref AllowedOrigins], !Sub "https://${WebDistribution.DomainName}"]]]
            AllowedMethods: [PUT, GET]
            AllowedHeaders: !If [UseIfNoneMatch, [Content-Type, If-None-Match], [Content-Type]]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOriginals
            Status: Enabled
            Prefix: photos/original/
            ExpirationInDays: 7
          - Id: AbortIncompleteUploads
            Status: Enabled
            Prefix: photos/
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt PhotoQueue.Arn
            Filter:
              S3Key:
                Rules: [{ Name: prefix, Value: photos/original/ }]

  PhotoBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotoBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt PhotoBucket.Arn, !Sub "${PhotoBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }
          - !If
            - UseIfNoneMatch
            - Sid: DenyOriginalPutWithoutIfNoneMatch
              Effect: Deny
              Principal: "*"
              Action: s3:PutObject
              Resource: !Sub "${PhotoBucket.Arn}/photos/original/*"
              Condition: { "Null": { "s3:if-none-match": "true" } }
            - !Ref AWS::NoValue

  PillowLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layers/pillow/
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [x86_64]
    Metadata:
      BuildMethod: python3.12
      BuildArchitecture: x86_64

  PhotoProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: workers.photo_processor.handler
      Timeout: 30
      MemorySize: 1024
      Architectures: [x86_64]
      Layers: [!Ref PillowLayer]
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              # complete_claim(트랜잭션 Update 3·Put 1, ConditionCheck 없음)와 상태 전이·조회. index/*·Query 없음
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt HaruTable.Arn
            - Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-photos-${AWS::AccountId}/photos/original/*
            - Effect: Allow
              Action: [s3:PutObject, s3:DeleteObject]
              Resource: !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-photos-${AWS::AccountId}/photos/processed/*
            - Effect: Allow
              # 이벤트 소스 매핑이 쓰는 권한을 이 큐로만 준다. SAM의 SQS 이벤트는 AWSLambdaSQSQueueExecutionRole(Resource *)을
              # 붙이므로 쓰지 않고 아래 PhotoProcessorQueueMapping을 직접 둔다(Requirement 11.3)
              Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
              Resource: !GetAtt PhotoQueue.Arn
      Environment:
        Variables:
          PHOTO_BUCKET: !Sub ${AWS::StackName}-photos-${AWS::AccountId}
          FAULT_INJECT: !If [FaultAllowed, !Ref FaultInject, ""]
          FAULT_INJECT_ALLOWED: !If [FaultAllowed, "true", "false"]
          FAULT_DELAY_S: "5"
          PHOTO_SDK_CONNECT_TIMEOUT_S: "2"
          PHOTO_SDK_READ_TIMEOUT_S: "5"
          PHOTO_SDK_MAX_ATTEMPTS: "2"
          PHOTO_RESERVE_MS: "5000"
          PRE_READ_MS: "7000"
          PRE_PROCESS_MS: "12000"
          PRE_UPLOAD_MS: "7000"
          PRE_COMPLETE_MS: "10000"

  PhotoProcessorQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref PhotoProcessorFunction
      EventSourceArn: !GetAtt PhotoQueue.Arn
      BatchSize: 1
      Enabled: true

  PhotoDLQNotEmpty:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PhotoDLQ에 메시지가 있다(T9). 런북 backend/README.md "사진 DLQ 복구"를 따른다.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt PhotoDLQ.QueueName }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      # 알림 대상은 두지 않는다(BE-Q62)

  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.pre_signup.handler

  PreSignUpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PreSignUpFunction.Arn
      Principal: cognito-idp.amazonaws.com
      # UserPool → 함수 → UserPool 순환 참조를 피하려고 와일드카드를 쓴다(design.md).
      SourceArn: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*

  # ------------------------------------------------------------------ 7단계 웹 호스팅 (BE-INFRA-02·03·04)
  # 순환 참조가 없는 방향: WebBucket ← WebDistribution(OAC) ← WebBucketPolicy, HttpApi·PhotoBucket CORS → WebDistribution.
  # 배포 도메인은 Distribution이 만든 뒤에만 알 수 있어 AllowedOrigins 파라미터에 넣을 수 없다. 템플릿이 덧붙인다.
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-web-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-web-oac
        Description: 웹 버킷 전용 OAC(SigV4). 버킷은 비공개다.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName} 웹(SPA)
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200  # 아시아 포함, 북미·유럽. 임시값(BE-Q132)
        Origins:
          - Id: web-s3
            DomainName: !GetAtt WebBucket.RegionalDomainName
            S3OriginConfig: { OriginAccessIdentity: "" }
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
        DefaultCacheBehavior:
          TargetOriginId: web-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed-CachingDisabled: index.html과 루트 파일은 항상 원본 확인(배포 직후 새 해시 파일명을 바로 받게 한다)
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # Managed-SecurityHeadersPolicy
          ResponseHeadersPolicyId: 67f7725c-6f97-48c1-86a6-d8d6b5fc7a49
        CacheBehaviors:
          - PathPattern: /assets/*
            TargetOriginId: web-s3
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            # Managed-CachingOptimized: 해시 파일명 정적 자산을 오래 캐시한다(원본 Cache-Control 범위 안에서)
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: 67f7725c-6f97-48c1-86a6-d8d6b5fc7a49
        # SPA 라우팅: 비공개 버킷에서 없는 객체는 403(ListBucket 권한 없음)이나 404다. 둘 다 index.html(200)로 돌려준다.
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }
        ViewerCertificate: { CloudFrontDefaultCertificate: true }

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt WebBucket.Arn, !Sub "${WebBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

  # ------------------------------------------------------------------ 7단계 알람 (BE-OBS-02)
  # PhotoDLQNotEmpty·AgentTokensAlarm은 위에 이미 있다. 알림 대상(SNS)은 두지 않는다(BE-Q62). 임계값은 파라미터(임시값, BE-Q130).
  HttpApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: HTTP API 5xx 5분 합계가 AlarmApi5xxThreshold를 넘었다(임시 임계값, BE-Q130).
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions: [{ Name: ApiId, Value: !Ref HttpApi }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref AlarmApi5xxThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: 모든 Lambda 함수의 Errors 5분 합계가 AlarmLambdaErrorsThreshold 이상이다(임시 임계값, BE-Q130).
      Threshold: !Ref AlarmLambdaErrorsThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      Metrics:
        - Id: m1
          ReturnData: false
          MetricStat:
            Metric: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref MeFunction }] }
            Period: 300
            Stat: Sum
        - Id: m2
          ReturnData: false
          MetricStat:
            Metric: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref PlansFunction }] }
            Period: 300
            Stat: Sum
        - Id: m3
          ReturnData: false
          MetricStat:
            Metric: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref ClaimsFunction }] }
            Period: 300
            Stat: Sum
        - Id: m4
          ReturnData: false
          MetricStat:
            Metric: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref InboxFunction }] }
            Period: 300
            Stat: Sum
        - Id: m5
          ReturnData: false
          MetricStat:
            Metric: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref AiCardFunction }] }
            Period: 300
            Stat: Sum
        - Id: m6
          ReturnData: false
          MetricStat:
            Metric: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref PhotoProcessorFunction }] }
            Period: 300
            Stat: Sum
        - Id: m7
          ReturnData: false
          MetricStat:
            Metric: { Namespace: AWS/Lambda, MetricName: Errors, Dimensions: [{ Name: FunctionName, Value: !Ref PreSignUpFunction }] }
            Period: 300
            Stat: Sum
        - { Id: total, Expression: "SUM(METRICS())", Label: Lambda Errors 합계, ReturnData: true }

  ApiLambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Me·Plans·Claims·Inbox 함수 중 하나의 Duration p95가 AlarmApiLambdaDurationMs를 넘었다(임시 임계값, BE-Q130).
      Threshold: !Ref AlarmApiLambdaDurationMs
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      Metrics:
        - Id: m1
          ReturnData: false
          MetricStat:
            Metric: { Namespace: AWS/Lambda, MetricName: Duration, Dimensions: [{ Name: FunctionName, Value: !Ref MeFunction }] }
            Period: 300
            Stat: p95
        - Id: m2
          ReturnData: false
          MetricStat:
            Metric: { Namespace: AWS/Lambda, MetricName: Duration, Dimensions: [{ Name: FunctionName, Value: !Ref PlansFunction }] }
            Period: 300
            Stat: p95
        - Id: m3
          ReturnData: false
          MetricStat:
            Metric: { Namespace: AWS/Lambda, MetricName: Duration, Dimensions: [{ Name: FunctionName, Value: !Ref ClaimsFunction }] }
            Period: 300
            Stat: p95
        - Id: m4
          ReturnData: false
          MetricStat:
            Metric: { Namespace: AWS/Lambda, MetricName: Duration, Dimensions: [{ Name: FunctionName, Value: !Ref InboxFunction }] }
            Period: 300
            Stat: p95
        - { Id: worst, Expression: "MAX(METRICS())", Label: API 함수 Duration p95 최대, ReturnData: true }

  AiCardLambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: AiCardFunction Duration p95가 AlarmAiLambdaDurationMs를 넘었다(타임아웃 27초, 임시 임계값, BE-Q130).
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions: [{ Name: FunctionName, Value: !Ref AiCardFunction }]
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref AlarmAiLambdaDurationMs
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  PhotoLambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PhotoProcessorFunction Duration p95가 AlarmPhotoLambdaDurationMs를 넘었다(타임아웃 30초, 임시 임계값, BE-Q130).
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions: [{ Name: FunctionName, Value: !Ref PhotoProcessorFunction }]
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref AlarmPhotoLambdaDurationMs
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  # ------------------------------------------------------------------ 7단계 대시보드 (BE-OBS-03)
  # 위젯 지표는 common/metrics.py·handlers/ai_agent.py가 실제로 내는 EMF 이름과 AWS 기본 지표만 쓴다(tests/unit/test_dashboard.py가 확인).
  OpsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-ops
      DashboardBody: !Sub |
        {"widgets":[
          {"type":"text","x":0,"y":0,"width":24,"height":4,"properties":{"markdown":"**운영 대시보드 (BE-OBS-03)** — 값은 `Haru` 네임스페이스 EMF 지표와 AWS 기본 지표다. 한계: (1) **AI 세션 상태 분포**(ASKING·WORKING·READY·FAILED 개수)는 CloudWatch 지표로 내지 않는다. 아래 '세션 결과(근사)'는 턴 수·질문·degraded·실패 지표로 본 근사이고, 정확한 분포는 `scripts/report.py`(DynamoDB 저장 값)로 본다. (2) **AI 모델 호출 수·토큰**은 에이전트 모드(AGENT_MODE=agent)에서만 지표가 나온다. (3) **이어받기 충돌**은 409 ALREADY_CLAIMED 수(`ClaimConflict`)다. (4) EMF 지표에 차원이 없어 모드·경로별 분리는 할 수 없다."}},
          {"type":"metric","x":0,"y":4,"width":12,"height":6,"properties":{"title":"API 요청 수와 오류(합계)","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":300,"metrics":[["AWS/ApiGateway","Count","ApiId","${HttpApi}",{"stat":"Sum","label":"요청"}],["AWS/ApiGateway","4xx","ApiId","${HttpApi}",{"stat":"Sum","label":"4xx"}],["AWS/ApiGateway","5xx","ApiId","${HttpApi}",{"stat":"Sum","label":"5xx"}]]}},
          {"type":"metric","x":12,"y":4,"width":12,"height":6,"properties":{"title":"API 5xx 오류율(%)","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":300,"metrics":[["AWS/ApiGateway","Count","ApiId","${HttpApi}",{"stat":"Sum","id":"m1","visible":false}],["AWS/ApiGateway","5xx","ApiId","${HttpApi}",{"stat":"Sum","id":"m2","visible":false}],[{"expression":"100*m2/m1","label":"5xx %","id":"e1"}]],"yAxis":{"left":{"min":0}}}},
          {"type":"metric","x":0,"y":10,"width":12,"height":6,"properties":{"title":"API 지연(p95, ms)","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":300,"metrics":[["AWS/ApiGateway","Latency","ApiId","${HttpApi}",{"stat":"p95","label":"Latency"}],["AWS/ApiGateway","IntegrationLatency","ApiId","${HttpApi}",{"stat":"p95","label":"IntegrationLatency"}]]}},
          {"type":"metric","x":12,"y":10,"width":12,"height":6,"properties":{"title":"Lambda 호출 수","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":300,"metrics":[["AWS/Lambda","Invocations","FunctionName","${MeFunction}",{"stat":"Sum","label":"Me"}],["AWS/Lambda","Invocations","FunctionName","${PlansFunction}",{"stat":"Sum","label":"Plans"}],["AWS/Lambda","Invocations","FunctionName","${ClaimsFunction}",{"stat":"Sum","label":"Claims"}],["AWS/Lambda","Invocations","FunctionName","${InboxFunction}",{"stat":"Sum","label":"Inbox"}],["AWS/Lambda","Invocations","FunctionName","${AiCardFunction}",{"stat":"Sum","label":"AiCard"}],["AWS/Lambda","Invocations","FunctionName","${PhotoProcessorFunction}",{"stat":"Sum","label":"PhotoProcessor"}],["AWS/Lambda","Invocations","FunctionName","${PreSignUpFunction}",{"stat":"Sum","label":"PreSignUp"}]]}},
          {"type":"metric","x":0,"y":16,"width":12,"height":6,"properties":{"title":"Lambda 오류","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":300,"metrics":[["AWS/Lambda","Errors","FunctionName","${MeFunction}",{"stat":"Sum","label":"Me"}],["AWS/Lambda","Errors","FunctionName","${PlansFunction}",{"stat":"Sum","label":"Plans"}],["AWS/Lambda","Errors","FunctionName","${ClaimsFunction}",{"stat":"Sum","label":"Claims"}],["AWS/Lambda","Errors","FunctionName","${InboxFunction}",{"stat":"Sum","label":"Inbox"}],["AWS/Lambda","Errors","FunctionName","${AiCardFunction}",{"stat":"Sum","label":"AiCard"}],["AWS/Lambda","Errors","FunctionName","${PhotoProcessorFunction}",{"stat":"Sum","label":"PhotoProcessor"}],["AWS/Lambda","Errors","FunctionName","${PreSignUpFunction}",{"stat":"Sum","label":"PreSignUp"}]]}},
          {"type":"metric","x":12,"y":16,"width":12,"height":6,"properties":{"title":"Lambda 응답 시간(p95, ms)","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":300,"metrics":[["AWS/Lambda","Duration","FunctionName","${MeFunction}",{"stat":"p95","label":"Me"}],["AWS/Lambda","Duration","FunctionName","${PlansFunction}",{"stat":"p95","label":"Plans"}],["AWS/Lambda","Duration","FunctionName","${ClaimsFunction}",{"stat":"p95","label":"Claims"}],["AWS/Lambda","Duration","FunctionName","${InboxFunction}",{"stat":"p95","label":"Inbox"}],["AWS/Lambda","Duration","FunctionName","${AiCardFunction}",{"stat":"p95","label":"AiCard"}],["AWS/Lambda","Duration","FunctionName","${PhotoProcessorFunction}",{"stat":"p95","label":"PhotoProcessor"}],["AWS/Lambda","Duration","FunctionName","${PreSignUpFunction}",{"stat":"p95","label":"PreSignUp"}]]}},
          {"type":"metric","x":0,"y":22,"width":12,"height":6,"properties":{"title":"이어받기·완료 정합성","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":300,"metrics":[["Haru","ClaimConflict",{"stat":"Sum","label":"이어받기 충돌(409)"}],["Haru","CompleteDuplicate",{"stat":"Sum","label":"중복 완료 요청(멱등 응답)"}],["Haru","StaleRequestRejected",{"stat":"Sum","label":"종료된 이어받기 요청 거절"}]]}},
