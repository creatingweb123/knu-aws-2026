AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  이어온 하루 백엔드 1–5단계와 6a·6b단계 (HttpApi + JWT authorizer, Cognito, HaruTable, /me, /plans, /claims, /inbox,
  사진 파이프라인, AI 하루 카드 /ai/card-sessions, 레벨 0과 6b 에이전트·체크포인트 테이블). CloudFront·웹 버킷은 이후 단계에서 추가한다.

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:5173
    Description: API CORS 허용 Origin. CloudFront 도메인은 7단계에서 추가한다(BE-INFRA-03). 사진 버킷 CORS도 같은 값을 쓴다.
  Stage:
    Type: String
    AllowedValues: [dev, demo]
    Default: demo
    Description: samconfig.toml의 dev/demo가 명시한다. 기본을 demo로 두어 장애 주입(BE-Q59)과 Fake 모델(BE-Q86)이 기본 차단된다.
  FaultInject:
    Type: String
    AllowedValues: ["", photo, photo-slow]
    Default: ""
    Description: dev 전용 장애·지연 주입(T9, T10·T15). Stage=dev이고 실제 스택 이름이 haru-dev일 때만 함수에 들어간다.
  UploadIfNoneMatch:
    Type: String
    AllowedValues: ["false", "true"]
    Default: "false"
    Description: presigned PUT에 If-None-Match:* 서명(BE-Q65). 프론트엔드 승인 전에는 false를 유지한다.
  # --- AI 하루 카드 (6a, docs/03 §3.2 설정 키). 공급자·모델 값은 BE-Q6 확정 전까지 빈 값이다(samconfig에 넣지 않는다).
  LlmProvider:
    Type: String
    AllowedValues: [bedrock, openai_compat, fake]
    Default: bedrock
    Description: bedrock은 Amazon Bedrock Converse(IAM 인증, 키 없음). fake는 Stage=dev이고 실제 스택 이름이 haru-dev일 때만 함수에 들어간다(BE-Q86). 결과는 실제 공급자 검증이 아니다.
  LlmBaseUrl:
    Type: String
    Default: ""
    Description: /chat/completions 앞까지. 빈 값이면 openai_compat은 CONFIG(503)로 끝나 사연이 나가지 않는다.
  LlmModel:
    Type: String
    Default: ""
    Description: bedrock은 모델 ID 또는 추론 프로필 ID(예 apac.anthropic.claude-...). 빈 값이면 CONFIG(503)로 끝나 사연이 나가지 않는다.
  LlmRegion:
    Type: String
    Default: ""
    AllowedPattern: ^$|^[a-z]{2}(-[a-z]+)+-[0-9]$
    Description: bedrock 호출 리전. 빈 값이면 함수 리전(AWS_REGION)이다.
  LlmApiKeyParam:
    Type: String
    Default: ""
    AllowedPattern: ^$|^(/[A-Za-z0-9_.-]+)+$
    Description: SSM SecureString 이름(/haru/<stage>/llm/api-key). 템플릿은 만들지 않는다(AWS 담당, BE-Q81). 빈 값이면 SSM 권한도 없다.
  LlmProviderLabel:
    Type: String
    Default: ""
  LlmTemperature:
    Type: String
    Default: "0"
    Description: 빈 값이면 보내지 않는다(1 미만을 거부하는 공급자).
  LlmMaxTokens:
    Type: String
    Default: "800"
  LlmConnectTimeoutS:
    Type: String
    Default: "2"
  LlmReadTimeoutS:
    Type: String
    Default: "8"
  LlmExtraBody:
    Type: String
    Default: ""
    Description: 공급자별 추가 필드 JSON 객체. 예 {"reasoning_effort":"none"}
  LlmToolChoice:
    Type: String
    AllowedValues: ["", auto, required]
    Default: ""
    Description: 6b bind_tools용. 레벨 0은 쓰지 않는다.
  LlmParallelToolCalls:
    Type: String
    AllowedValues: ["", "false"]
    Default: ""
    Description: 6b bind_tools용. 레벨 0은 쓰지 않는다.
  AgentMode:
    Type: String
    AllowedValues: [pipeline, agent]
    Default: pipeline
    Description: pipeline = 레벨 0(6a), agent = 6b 에이전트. 바꾸면 진행 중 에이전트 세션은 다음 요청에서 결정적으로 닫힌다(design §13).
  AiFaultInject:
    Type: String
    AllowedValues: ["", ai-slow]
    Default: ""
    Description: dev 전용 장애 주입(T21, BE-Q107). 5단계 FaultInject와 이름을 나눈다.
  AiDailySessionLimit:
    Type: String
    Default: "10"

Conditions:
  IsDev: !Equals [!Ref Stage, dev]
  # Rules는 파라미터 값만 검사하므로 실제 스택 이름까지 확인한다(BE-Q86, 5단계 BE-Q59와 같은 방식). 이름은 samconfig dev stack_name과 같다.
  FakeAllowed: !And [!Condition IsDev, !Equals [!Ref "AWS::StackName", haru-dev]]
  # 5단계 사진 장애 주입(BE-Q59). FakeAllowed와 같은 조건이다.
  FaultAllowed: !And [!Condition IsDev, !Equals [!Ref "AWS::StackName", haru-dev]]
  UseIfNoneMatch: !Equals [!Ref UploadIfNoneMatch, "true"]
  HasLlmKeyParam: !Not [!Equals [!Ref LlmApiKeyParam, ""]]
  LlmIsFake: !Equals [!Ref LlmProvider, fake]
  HasLlmRegion: !Not [!Equals [!Ref LlmRegion, ""]]

Rules:
  FakeLlmOnlyInDev:
    Assertions:
      - Assert: !Or [!Equals [!Ref Stage, dev], !Not [!Equals [!Ref LlmProvider, fake]]]
        AssertDescription: LlmProvider=fake는 Stage=dev에서만 쓸 수 있다(BE-Q86).
  AiFaultInjectOnlyInDev:
    Assertions:
      - Assert: !Or [!Equals [!Ref Stage, dev], !Equals [!Ref AiFaultInject, ""]]
        AssertDescription: AiFaultInject는 Stage=dev에서만 쓸 수 있다(BE-Q107).
  FaultInjectOnlyInDev:
    Assertions:
      - Assert: !Or [!Equals [!Ref Stage, dev], !Equals [!Ref FaultInject, ""]]
        AssertDescription: FaultInject는 Stage=dev에서만 쓸 수 있다(BE-Q59).

Globals:
  Function:
    Runtime: python3.12
    CodeUri: src/
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref HaruTable
        AREA_ID: default
        CLAIM_DURATION_DAYS: "3"
        LANGSMITH_TRACING: "false"
        LANGCHAIN_TRACING_V2: "false"
        # AWS_ENDPOINT_URL, AWS_EMF_ENVIRONMENT는 로컬 전용이라 정의하지 않는다(BE-INFRA-05).

Resources:
  HaruTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # 6b 에이전트 그래프 체크포인트(design §18.1). 항목 ttl ≤ AiSession ttl(BE-Q104). AiCardFunction만 쓴다.
  HaruAgentCheckpoints:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UsernameAttributes: [email]
      Schema:
        - Name: nickname
          AttributeDataType: String
          Mutable: true
          Required: true
      # 비밀번호 정책은 Cognito 기본(BE-Q27)
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # StageName을 두지 않으면 스테이지는 $default다.
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowHeaders: [Authorization, Content-Type, Idempotency-Key]
        AllowMethods: [GET, POST, PUT, OPTIONS]
      # AI 경로 스로틀(BE-Q82 임시값, design §19.2). 초과 응답 429 {"message":"Too Many Requests"}는 계약 에러 형식이 아니다(BE-Q92).
      RouteSettings:
        "POST /ai/card-sessions": { ThrottlingRateLimit: 2, ThrottlingBurstLimit: 5 }
        "POST /ai/card-sessions/{sessionId}/turns": { ThrottlingRateLimit: 5, ThrottlingBurstLimit: 10 }
        "GET /ai/card-sessions/{sessionId}": { ThrottlingRateLimit: 10, ThrottlingBurstLimit: 20 }

  # 경로는 src/handlers/routes.py와 같아야 한다(tests/unit/test_template.py가 확인).
  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.me.handler
      # GET /me는 HaruTable 기본 테이블 Query로 미확인 수를 센다. GET /me/claims가 GSI2 조회와 Plan·Record 읽기를 쓴다.
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Query]
              Resource:
                - !GetAtt HaruTable.Arn
                - !Sub ${HaruTable.Arn}/index/*
      Events:
        GetMe:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /me, Method: GET }
        GetMyClaims:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /me/claims, Method: GET }

  PlansFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.plans.handler
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              # TransactWriteItems의 Put·Update는 dynamodb:PutItem·UpdateItem 권한으로 실행된다.
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query]
              Resource:
                - !GetAtt HaruTable.Arn
                - !Sub ${HaruTable.Arn}/index/*
      Events:
        CreatePlan:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /plans, Method: POST }
        ListPlans:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /plans, Method: GET }
        GetPlan:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/plans/{planId}", Method: GET }
        ClaimPlan:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/plans/{planId}/claims", Method: POST }

  ClaimsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.claims.handler
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              # 포기·기록·완료 트랜잭션(Update·Put·ConditionCheck)과 ConsistentRead 읽기. Query는 쓰지 않는다.
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:ConditionCheckItem]
              Resource: !GetAtt HaruTable.Arn
            - Effect: Allow
              # 원본 업로드 presigned PUT 서명용(서명한 역할의 권한으로 실행된다, Requirement 11.1)
              Action: [s3:PutObject]
              Resource: !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-photos-${AWS::AccountId}/photos/original/*
      Environment:
        Variables:
          PHOTO_BUCKET: !Sub ${AWS::StackName}-photos-${AWS::AccountId}
          PUBLIC_S3_ENDPOINT: ""
          PHOTO_UPLOAD_IF_NONE_MATCH: !If [UseIfNoneMatch, "true", "false"]
      Events:
        AbandonClaim:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/claims/{claimId}/abandon", Method: POST }
        GetRecord: # TransactGetItems는 GetItem 권한으로 실행된다(BE-Q46 권장안, 계약 변경 승인 대기)
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/claims/{claimId}/record", Method: GET }
        PutRecord:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/claims/{claimId}/record", Method: PUT }
        ReplacePhoto:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/claims/{claimId}/record/photo", Method: POST }
        CompleteClaim:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/claims/{claimId}/complete", Method: POST }

  # AI 하루 카드 레벨 0 (6a). AI 의존성은 이 함수 산출물에만 들어간다(src/Makefile, BE-Q80).
  AiCardFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Handler: handlers.ai_card.handler
      Timeout: 27  # HTTP API 통합 상한 30초보다 짧게(docs/03 §3.2)
      MemorySize: 1024
      Architectures: [x86_64]
      Environment:
        Variables:
          # fake가 허용되지 않으면 bedrock으로 바꾼다(함수에 fake가 들어가지 않는다)
          LLM_PROVIDER: !If [FakeAllowed, !Ref LlmProvider, !If [LlmIsFake, bedrock, !Ref LlmProvider]]
          FAKE_LLM_ALLOWED: !If [FakeAllowed, "true", "false"]
          LLM_BASE_URL: !Ref LlmBaseUrl
          LLM_MODEL: !Ref LlmModel
          LLM_REGION: !If [HasLlmRegion, !Ref LlmRegion, !Ref "AWS::NoValue"]
          LLM_API_KEY_PARAM: !If [HasLlmKeyParam, !Ref LlmApiKeyParam, !Ref "AWS::NoValue"]
          LLM_PROVIDER_LABEL: !Ref LlmProviderLabel
          LLM_TEMPERATURE: !Ref LlmTemperature
          LLM_MAX_TOKENS: !Ref LlmMaxTokens
          LLM_CONNECT_TIMEOUT_S: !Ref LlmConnectTimeoutS
          LLM_READ_TIMEOUT_S: !Ref LlmReadTimeoutS
          LLM_MAX_RETRIES: "0"
          LLM_EXTRA_BODY: !Ref LlmExtraBody
          LLM_TOOL_CHOICE: !Ref LlmToolChoice
          LLM_PARALLEL_TOOL_CALLS: !Ref LlmParallelToolCalls
          AGENT_MODE: !Ref AgentMode
          CHECKPOINT_TABLE: !Ref HaruAgentCheckpoints
          # 장애 주입 세 겹 차단: Rules, 이 조건(dev ∧ haru-dev), 런타임(FAULT_INJECT_ALLOWED ∧ 함수 이름 haru-dev-)
          FAULT_INJECT: !If [FakeAllowed, !Ref AiFaultInject, ""]
          FAULT_INJECT_ALLOWED: !If [FakeAllowed, "true", "false"]
          AI_DAILY_SESSION_LIMIT: !Ref AiDailySessionLimit
          # AI 함수 전용 SDK 설정(BE-Q85). 다른 함수는 기본값 그대로다(BE-Q48).
          AI_SDK_CONNECT_TIMEOUT_S: "1"
          AI_SDK_READ_TIMEOUT_S: "2"
          AI_SDK_MAX_ATTEMPTS: "2"
          # LLM_API_KEY는 정의하지 않는다(로컬 전용). 키는 SSM에서 읽는다.
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              # 자기 세션·할당량 항목만. Plan·User·Claim·Idem 키에는 쓰지 못한다(G6, BE-INFRA-06).
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt HaruTable.Arn
              Condition:
                ForAllValues:StringLike:
                  dynamodb:LeadingKeys: ["AISESSION#*", "AIQUOTA#*"]
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              # 체크포인트 라이브러리가 쓰는 연산 5개뿐(V9). delete_thread는 BatchWriteItem DeleteRequest
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query, dynamodb:BatchGetItem, dynamodb:BatchWriteItem]
              Resource: !GetAtt HaruAgentCheckpoints.Arn
        - !If
          - HasLlmKeyParam
          - Version: "2012-10-17"
            Statement:
              - Effect: Allow
                # aws/ssm 관리형 키는 KMS 권한이 따로 필요 없다(design §14.3).
                Action: ssm:GetParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${LlmApiKeyParam}"
          - !Ref "AWS::NoValue"
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              # Bedrock Converse(LLM_PROVIDER=bedrock). 스트리밍은 쓰지 않는다. 교차 리전 추론 프로필은
              # 프로필과 대상 리전들의 기반 모델 둘 다 권한이 있어야 해서 기반 모델은 리전을 와일드카드로 둔다.
              Action: bedrock:InvokeModel
              Resource:
                - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"
                - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:application-inference-profile/*"
      Events:
        CreateAiCardSession:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /ai/card-sessions, Method: POST }
        GetAiCardSession:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/ai/card-sessions/{sessionId}", Method: GET }
        AiCardSessionTurn:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/ai/card-sessions/{sessionId}/turns", Method: POST }

  # 에이전트 토큰 사용량(design §17, BE-Q114 임시). 세션 상한 3만 × 10. 알림 대상은 두지 않는다(BE-Q62와 같은 방식).
  AgentTokensAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: AI 에이전트 토큰 5분 합계가 300,000을 넘었다(임시 임계값, BE-Q114).
      Namespace: Haru
      MetricName: AgentTokens
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  InboxFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.inbox.handler
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              # 수신함 Query·상세 GetItem(InboxItem·Plan·Record)과 read·reply 조건부 UpdateItem. GSI는 쓰지 않는다.
              Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:UpdateItem]
              Resource: !GetAtt HaruTable.Arn
            - Effect: Allow
              # 수신함 상세 photoUrl presigned GET 서명용(전달된 처리본만, Requirement 11.2)
              Action: [s3:GetObject]
              Resource: !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-photos-${AWS::AccountId}/photos/processed/*
      Environment:
        Variables:
          PHOTO_BUCKET: !Sub ${AWS::StackName}-photos-${AWS::AccountId}
          PUBLIC_S3_ENDPOINT: ""
      Events:
        ListInbox:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /inbox, Method: GET }
        GetInboxItem:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/inbox/{itemId}", Method: GET }
        ReadInboxItem:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/inbox/{itemId}/read", Method: POST }
        ReplyInboxItem:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/inbox/{itemId}/reply", Method: POST }

  # ---------------------------------------------------------------- 5단계 사진 파이프라인 (docs/02 §2.7)
  # 순환 의존성 회피(BE-PHOTO-09): 큐 정책은 버킷 ARN을 문자열로 쓰고, 버킷은 큐 정책 뒤에 만든다.
  PhotoDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14일(BE-Q53)
      SqsManagedSseEnabled: true

  PhotoQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180 # 6 × PhotoProcessorFunction Timeout(30초)
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PhotoDLQ.Arn
        maxReceiveCount: 3

  PhotoQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref PhotoQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt PhotoQueue.Arn
            Condition:
              ArnEquals: { "aws:SourceArn": !Sub "arn:${AWS::Partition}:s3:::${AWS::StackName}-photos-${AWS::AccountId}" }
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }

  PhotoBucket:
    Type: AWS::S3::Bucket
    DependsOn: PhotoQueuePolicy
    Properties:
      BucketName: !Sub ${AWS::StackName}-photos-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Ref AllowedOrigins
            AllowedMethods: [PUT, GET]
            AllowedHeaders: !If [UseIfNoneMatch, [Content-Type, If-None-Match], [Content-Type]]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOriginals
            Status: Enabled
            Prefix: photos/original/
            ExpirationInDays: 7
          - Id: AbortIncompleteUploads
            Status: Enabled
            Prefix: photos/
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt PhotoQueue.Arn
            Filter:
              S3Key:
                Rules: [{ Name: prefix, Value: photos/original/ }]

  PhotoBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotoBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt PhotoBucket.Arn, !Sub "${PhotoBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }
          - !If
            - UseIfNoneMatch
            - Sid: DenyOriginalPutWithoutIfNoneMatch
              Effect: Deny
              Principal: "*"
              Action: s3:PutObject
              Resource: !Sub "${PhotoBucket.Arn}/photos/original/*"
              Condition: { "Null": { "s3:if-none-match": "true" } }
            - !Ref AWS::NoValue

  PillowLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layers/pillow/
      CompatibleRuntimes: [python3.12]
      CompatibleArchitectures: [x86_64]
    Metadata:
      BuildMethod: python3.12
      BuildArchitecture: x86_64

  PhotoProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: workers.photo_processor.handler
      Timeout: 30
      MemorySize: 1024
      Architectures: [x86_64]
      Layers: [!Ref PillowLayer]
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              # complete_claim(트랜잭션 Update 3·Put 1, ConditionCheck 없음)와 상태 전이·조회. index/*·Query 없음
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt HaruTable.Arn
            - Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-photos-${AWS::AccountId}/photos/original/*
            - Effect: Allow
              Action: [s3:PutObject, s3:DeleteObject]
              Resource: !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-photos-${AWS::AccountId}/photos/processed/*
            - Effect: Allow
              # 이벤트 소스 매핑이 쓰는 권한을 이 큐로만 준다. SAM의 SQS 이벤트는 AWSLambdaSQSQueueExecutionRole(Resource *)을
              # 붙이므로 쓰지 않고 아래 PhotoProcessorQueueMapping을 직접 둔다(Requirement 11.3)
              Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
              Resource: !GetAtt PhotoQueue.Arn
      Environment:
        Variables:
          PHOTO_BUCKET: !Sub ${AWS::StackName}-photos-${AWS::AccountId}
          FAULT_INJECT: !If [FaultAllowed, !Ref FaultInject, ""]
          FAULT_INJECT_ALLOWED: !If [FaultAllowed, "true", "false"]
          FAULT_DELAY_S: "5"
          PHOTO_SDK_CONNECT_TIMEOUT_S: "2"
          PHOTO_SDK_READ_TIMEOUT_S: "5"
          PHOTO_SDK_MAX_ATTEMPTS: "2"
          PHOTO_RESERVE_MS: "5000"
          PRE_READ_MS: "7000"
          PRE_PROCESS_MS: "12000"
          PRE_UPLOAD_MS: "7000"
          PRE_COMPLETE_MS: "10000"

  PhotoProcessorQueueMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref PhotoProcessorFunction
      EventSourceArn: !GetAtt PhotoQueue.Arn
      BatchSize: 1
      Enabled: true

  PhotoDLQNotEmpty:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: PhotoDLQ에 메시지가 있다(T9). 런북 backend/README.md "사진 DLQ 복구"를 따른다.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt PhotoDLQ.QueueName }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      # 알림 대상은 두지 않는다(BE-Q62)

  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.pre_signup.handler

  PreSignUpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PreSignUpFunction.Arn
      Principal: cognito-idp.amazonaws.com
      # UserPool → 함수 → UserPool 순환 참조를 피하려고 와일드카드를 쓴다(design.md).
      SourceArn: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*

Outputs:
  ApiUrl:
    Description: HTTP API 주소 (스테이지 $default)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
