          {"type":"metric","x":0,"y":28,"width":12,"height":6,"properties":{"title":"사진 DLQ·큐 깊이","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":300,"metrics":[["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${PhotoDLQ.QueueName}",{"stat":"Maximum","label":"DLQ"}],["AWS/SQS","ApproximateNumberOfMessagesVisible","QueueName","${PhotoQueue.QueueName}",{"stat":"Maximum","label":"처리 대기 큐"}]]}},
          {"type":"metric","x":12,"y":28,"width":12,"height":6,"properties":{"title":"AI 응답 시간(ms)·오류","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":300,"metrics":[["Haru","AiLatencyMs",{"stat":"p50","label":"p50 ms"}],["Haru","AiLatencyMs",{"stat":"p95","label":"p95 ms"}],["Haru","AiFailure",{"stat":"Sum","label":"AiFailure","yAxis":"right"}],["Haru","AiInvalidOutput",{"stat":"Sum","label":"AiInvalidOutput","yAxis":"right"}]]}},
          {"type":"metric","x":0,"y":34,"width":12,"height":6,"properties":{"title":"에이전트 턴 시간(ms)","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":300,"metrics":[["Haru","AgentTurnMs",{"stat":"p50","label":"p50"}],["Haru","AgentTurnMs",{"stat":"p95","label":"p95"}]]}},
          {"type":"metric","x":12,"y":34,"width":12,"height":6,"properties":{"title":"AI 모델 호출 수·토큰(에이전트 모드)","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":300,"metrics":[["Haru","AgentModelCalls",{"stat":"Sum","label":"모델 호출 수"}],["Haru","AgentTokens",{"stat":"Sum","label":"토큰","yAxis":"right"}]]}},
