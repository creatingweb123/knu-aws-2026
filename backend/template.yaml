          {"type":"metric","x":12,"y":40,"width":12,"height":6,"properties":{"title":"AI 세션 결과(근사, 정확한 분포는 report.py)","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":300,"metrics":[["Haru","AiLatencyMs",{"stat":"SampleCount","label":"완료된 AI 턴"}],["Haru","AgentQuestionsAsked",{"stat":"Sum","label":"질문으로 멈춤"}],["Haru","AgentDegraded",{"stat":"Sum","label":"degraded"}],["Haru","AiFailure",{"stat":"Sum","label":"실패"}]]}},
          {"type":"metric","x":0,"y":46,"width":12,"height":6,"properties":{"title":"체크포인트 항목 크기(최대 bytes, 400KB 한도 감시)","region":"${AWS::Region}","view":"timeSeries","stacked":false,"period":300,"metrics":[["Haru","AgentCheckpointBytes",{"stat":"Maximum","label":"최대"}]],"yAxis":{"left":{"min":0}}}}
        ]}

  # ------------------------------------------------------------------ AWS Budgets 월 비용 알림 (BE-OBS-02, BE-Q131)
  # 계정 단위 비용이다(스택 태그 필터 없음). 금액·수신 이메일은 파라미터이고 둘 다 있을 때만 만든다.
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Condition: CreateBudget
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-monthly-cost
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref BudgetMonthlyUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetNotificationEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetNotificationEmail }]

Outputs:
  ApiUrl:
    Description: HTTP API 주소 (스테이지 $default)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  WebBucketName:
    Description: 프론트엔드 빌드 산출물(dist/)을 올릴 비공개 S3 버킷. scripts/deploy_web.py가 쓴다.
    Value: !Ref WebBucket
  DistributionId:
    Description: CloudFront 배포 ID(캐시 무효화용)
    Value: !Ref WebDistribution
  DistributionDomain:
    Description: CloudFront 도메인(https://로 접속). API·사진 버킷 CORS에 자동으로 들어간다.
    Value: !GetAtt WebDistribution.DomainName
